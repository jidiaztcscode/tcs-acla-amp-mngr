logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

# CORS LOCALES
# CORS: valores por defecto para desarrollo. Pueden ser sobreescritos por variable de entorno
# Establece `CORS_ALLOWED_ORIGINS` en el entorno para cambiar en despliegue (coma-separadas)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:7000}
cors.allowed-headers=Content-Type,Authorization,X-Requested-With,Accept
cors.allowed-methods=GET,PUT,POST,PATCH,DELETE,OPTIONS
cors.exposed-headers=Content-Disposition

